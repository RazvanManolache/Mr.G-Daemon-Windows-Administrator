name: Windows administrator build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: '8.0.x'
    - name: Verify pinned admin library contracts
      run: dotnet run --project MrG.Daemon.Admin/tests -c Release -p:TreatWarningsAsErrors=true
    - name: Publish self-contained Windows app
      run: dotnet publish MrG.Daemon.Admin.UI -c Release -r win-x64 --self-contained true -o dist/app -p:TreatWarningsAsErrors=true
    - name: Package download
      run: |
        $ErrorActionPreference = 'Stop'
        foreach ($name in @('MrG.Daemon.Admin.UI.exe', 'MrG.Daemon.Admin.dll', 'mrg.ico')) {
          if (!(Test-Path "dist/app/$name")) { throw "Missing output: $name" }
        }
        Copy-Item README.md dist/app/
        $env:GITHUB_SHA | Set-Content dist/app/BUILD-COMMIT.txt
        Compress-Archive dist/app/* dist/MrG-Daemon-Administrator-win-x64.zip
        "$( (Get-FileHash dist/MrG-Daemon-Administrator-win-x64.zip).Hash.ToLowerInvariant() )  MrG-Daemon-Administrator-win-x64.zip" | Set-Content dist/SHA256SUMS.txt
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: MrG-Daemon-Administrator-win-x64
        BUILD_PATHS: |
          dist/*.zip
          dist/SHA256SUMS.txt
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    permissions:
      contents: write
